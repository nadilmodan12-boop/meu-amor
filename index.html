<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Dashboard</h1>
            <p>Get weather information for any city</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter city name..."
                    autocomplete="off"
                >
                <button id="searchBtn">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
            <div class="suggestions" id="suggestions"></div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i> Loading weather data...
        </div>

        <div class="weather-container" id="weatherContainer" style="display: none;">
            <!-- Current Weather -->
            <div class="current-weather">
                <div class="city-info">
                    <h2 id="cityName"></h2>
                    <p id="currentDate"></p>
                </div>
                <div class="weather-main">
                    <div class="temperature-section">
                        <img id="weatherIcon" src="" alt="Weather icon">
                        <div class="temp-info">
                            <span id="temperature" class="temperature"></span>
                            <span id="weatherDescription" class="description"></span>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail-item">
                            <i class="fas fa-droplets"></i>
                            <div>
                                <p class="detail-label">Humidity</p>
                                <p id="humidity" class="detail-value"></p>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-wind"></i>
                            <div>
                                <p class="detail-label">Wind Speed</p>
                                <p id="windSpeed" class="detail-value"></p>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-compress"></i>
                            <div>
                                <p class="detail-label">Pressure</p>
                                <p id="pressure" class="detail-value"></p>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-eye"></i>
                            <div>
                                <p class="detail-label">Visibility</p>
                                <p id="visibility" class="detail-value"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Forecast -->
            <div class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div class="forecast-container" id="forecastContainer"></div>
            </div>

            <!-- Additional Info -->
            <div class="additional-info">
                <div class="info-card">
                    <i class="fas fa-sun"></i>
                    <div>
                        <p class="info-label">Sunrise</p>
                        <p id="sunrise" class="info-value"></p>
                    </div>
                </div>
                <div class="info-card">
                    <i class="fas fa-moon"></i>
                    <div>
                        <p class="info-label">Sunset</p>
                        <p id="sunset" class="info-value"></p>
                    </div>
                </div>
                <div class="info-card">
                    <i class="fas fa-arrow-up"></i>
                    <div>
                        <p class="info-label">Feels Like</p>
                        <p id="feelsLike" class="info-value"></p>
                    </div>
                </div>
                <div class="info-card">
                    <i class="fas fa-tint"></i>
                    <div>
                        <p class="info-label">Dew Point</p>
                        <p id="dewPoint" class="info-value"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
